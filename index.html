<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Poppins, Arial;
height:100vh;
color:#fff;
overflow:hidden;
background-size:cover;
background-position:center;
transition:background-image 1.2s ease;
}

/* Backgrounds */
.bg1{background-image:url("https://images.unsplash.com/photo-1501785888041-af3ef285b470")}
.bg2{background-image:url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee")}
.bg3{background-image:url("https://images.unsplash.com/photo-1519681393784-d120267933ba")}
.bg4{background-image:url("https://images.unsplash.com/photo-1500534314209-a25ddb2bd429")}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5)
}

.container{
position:relative;
z-index:2;
max-width:430px;
margin:auto;
top:50%;
transform:translateY(-50%);
background:rgba(255,255,255,.15);
backdrop-filter:blur(12px);
padding:28px;
border-radius:26px;
text-align:center;
animation:cardIn 1s ease;
}

h1{font-size:26px}
p{font-size:18px}

button,.opt{
background:rgba(255,255,255,.25);
border:none;
padding:13px;
border-radius:24px;
margin:10px 0;
font-size:16px;
color:#fff;
cursor:pointer;
transition:.3s
}
button:hover,.opt:hover{background:rgba(255,255,255,.45)}

@keyframes cardIn{
from{opacity:0;transform:translateY(50px) scale(.95)}
to{opacity:1;transform:translateY(0) scale(1)}
}

/* Text arrival */
.line{
opacity:0;
transform:translateY(25px);
animation:lineIn 1s forwards;
}
@keyframes lineIn{
to{opacity:1;transform:translateY(0)}
}

/* Shake for wrong answers */
.shake{
animation:shake .4s;
}
@keyframes shake{
0%,100%{transform:translateX(0)}
25%{transform:translateX(-6px)}
50%{transform:translateX(6px)}
75%{transform:translateX(-6px)}
}

/* Love meter */
.meter{
width:100%;
height:22px;
background:rgba(255,255,255,.3);
border-radius:20px;
overflow:hidden;
margin:12px 0
}
.fill{
height:100%;
width:0;
background:linear-gradient(90deg,#ff6a88,#ff99ac);
transition:.4s
}

/* Falling effects */
.petal,.star{
position:fixed;
top:-10px;
z-index:1;
animation:fall linear infinite;
}
@keyframes fall{
to{transform:translateY(110vh);opacity:0}
}
</style>
</head>

<body class="bg1">
<div class="overlay"></div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/audio/2023/03/27/audio_8b7e3e9b1f.mp3">
</audio>

<div class="container" id="box">
<h1>Are you ready, Khushu? ❤️</h1>
<button onclick="readyNo()">NO 😏</button>
<button onclick="next()">YES 🥹💖</button>
</div>

<script>
let step=0,taps=0;
const box=document.getElementById("box");
const body=document.body;
const music=document.getElementById("music");
const bgs=["bg1","bg2","bg3","bg4"];

function next(){
step++;
if(step===1)music.play();
body.className=bgs[step%bgs.length];

if(step===1){
box.innerHTML=`
<h1 class="line">Welcome baby ❤️</h1>
<p class="line" style="animation-delay:.6s">
to your hubby’s first try 🫶<br>
for a special thing for you ✨
</p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===2){
box.innerHTML=`
<h1 class="line">Hi Beautiful 💖</h1>
<p class="line" style="animation-delay:.6s">
This is for you my love 😘
</p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===3){
box.innerHTML=`
<p class="line">📅 21st June, 2023</p>
<p class="line" style="animation-delay:.7s">
Remember this day, my love 💗
</p>
<p class="line" style="animation-delay:1.4s">
I promised you to love<br>
365 days, 24 hours ⏳❤️
</p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===4){
box.innerHTML=`
<h1>Love Meter 💗</h1>
<p>Tap till it becomes infinite ♾️</p>
<div class="meter"><div class="fill" id="fill"></div></div>
<button onclick="tapLove()">Tap 💖</button>
<p id="m"></p>
<button onclick="next()">Next ➡️</button>`;
}

/* Memory Game 1 */
else if(step===5){
box.innerHTML=`
<h1>Our Memories 🧠💞</h1>
<div class="opt" onclick="mem('That moment still makes me smile 🥹')">First Meet 😌</div>
<div class="opt" onclick="mem('My safest place forever 🫂❤️')">First Hug 🫶</div>
<div class="opt" onclick="mem('Endless nights, endless love 🌙')">Late Night Talks 🌌</div>
<p id="rx"></p>
<button onclick="next()">Next ➡️</button>`;
}

/* Memory Game 2 */
else if(step===6){
box.innerHTML=`
<h1>What makes us special? 💕</h1>
<div class="opt" onclick="mem('Trust holds us together 🤍')">Trust 🤍</div>
<div class="opt" onclick="mem('We understand each other deeply 🫶')">Understanding 🫶</div>
<div class="opt" onclick="mem('Love beyond words 💖')">Love 💖</div>
<p id="rx"></p>
<button onclick="next()">Next ➡️</button>`;
}

/* Memory Game 3 */
else if(step===7){
box.innerHTML=`
<h1>Choose our vibe 😘</h1>
<div class="opt" onclick="mem('Cute & crazy is our style 😜')">Cute & Crazy 😜</div>
<div class="opt" onclick="mem('Calm but deep 🌌')">Calm & Deep 🌌</div>
<div class="opt" onclick="mem('Forever partners 💍')">Forever 💍</div>
<p id="rx"></p>
<button onclick="next()">Next ➡️</button>`;
}

/* MCQ 1 */
else if(step===8){
box.innerHTML=`
<h1>How much do I love you? 💕</h1>
<div class="opt" onclick="wrong(this,'That’s cute 😏 but far from truth')">A little 🤏</div>
<div class="opt" onclick="wrong(this,'Close 😌 but not enough baby')">A lot ❤️</div>
<div class="opt" onclick="correct('You know my heart 🥹♾️')">Infinite ♾️💖</div>
<p id="rx"></p>`;
}

/* MCQ 2 */
else if(step===9){
box.innerHTML=`
<h1>My plans with you 💍👶</h1>
<div class="opt" onclick="wrong(this,'Never ever 😤')">Just time pass 😅</div>
<div class="opt" onclick="correct('You are my future 🥹❤️')">Marriage + Baby + Forever</div>
<p id="rx"></p>`;
}

/* MCQ 3 */
else if(step===10){
box.innerHTML=`
<h1>What are you to me? 🌍</h1>
<div class="opt" onclick="wrong(this,'More than that 😘')">My girlfriend 😌</div>
<div class="opt" onclick="correct('That’s my world 🥹❤️')">My everything 💫</div>
<p id="rx"></p>`;
}

/* Valentine */
else if(step===11){
box.innerHTML=`
<h1>Will you be my Valentine? 💘</h1>
<button onclick="readyNo()">NO 😏</button>
<button onclick="next()">YES 😍</button>`;
}

/* Promise Page BEFORE Countdown */
else if(step===12){
box.innerHTML=`
<h1>My Promises 🤍</h1>
<p class="line" style="animation-delay:.4s">I promise to stand by you.</p>
<p class="line" style="animation-delay:1.2s">I promise to grow old with you.</p>
<p class="line" style="animation-delay:2s">I promise to love you endlessly.</p>
<button onclick="next()">Next ➡️</button>`;
}

/* Countdown */
else if(step===13){
countdown(5);
}
}

function readyNo(){
box.classList.add("shake");
box.innerHTML=`
<h1>Hey 😤💔</h1>
<p>You know the answer already 😌<br>
Choose YES, my love ❤️</p>
<button onclick="next()">YES 🥹</button>`;
setTimeout(()=>box.classList.remove("shake"),400);
}

function tapLove(){
taps++;
document.getElementById("fill").style.width=Math.min(taps*20,100)+"%";
document.getElementById("m").innerHTML=
taps>=5?"♾️ Our love is infinite ♾️":"Keep tapping baby 😘";
}

function mem(t){document.getElementById("rx").innerHTML=t}

function wrong(el,msg){
el.classList.add("shake");
document.getElementById("rx").innerHTML=msg;
setTimeout(()=>el.classList.remove("shake"),400);
}

function correct(msg){
document.getElementById("rx").innerHTML=msg;
setTimeout(next,1400);
}

function countdown(n){
let c=n;
box.innerHTML=`<h1>${c}</h1><p>Something special is coming… ✨</p>`;
let i=setInterval(()=>{
c--;
box.innerHTML=`<h1>${c}</h1><p>Something special is coming… ✨</p>`;
if(c===0){clearInterval(i);final()}
},1000);
}

function final(){
box.innerHTML=`
<h1>My Love ❤️</h1>
<p>
It's been 3 yrs and I always loved you and will always love you.<br><br>
This Valentine's Day I want to give you something special that I'll give you when I'll meet you.<br><br>
Tell me how much you liked it and always remember one thing my love…<br><br>
<b>I Loveeeeeeeeeeeeeeeeee youuuuuuuuuuuuuuuuu<br>
infiniteeeeeeeeeeeeeeeee myyyyyyyyyyyy wifeyyyyyyyyyyyy</b><br>
😘😘😘😘😘😘❤️❤️❤️✨✨✨🫂🫂🫂🫂🫂💗💗💗💗💗
</p>
<p style="margin-top:20px">
Thank you for experiencing this, my love 💌<br>
Give feedback to your baby 🥹❤️
</p>`;
}

/* Falling petals & stars */
setInterval(()=>{
let p=document.createElement("div");
p.className="petal";p.innerHTML="🌹";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=5+Math.random()*5+"s";
document.body.appendChild(p);
setTimeout(()=>p.remove(),9000);

let s=document.createElement("div");
s.className="star";s.innerHTML="✨";
s.style.left=Math.random()*100+"vw";
s.style.animationDuration=4+Math.random()*4+"s";
document.body.appendChild(s);
setTimeout(()=>s.remove(),8000);
},800);
</script>

</body>
</html>
