<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:'Playfair Display', serif;
height:100vh;
color:#fff;
overflow:hidden;
background-size:cover;
background-position:center;
transition:background-image 1.5s ease;
}

/* Backgrounds */
.bg1{background-image:url("https://images.unsplash.com/photo-1501785888041-af3ef285b470")}
.bg2{background-image:url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee")}
.bg3{background-image:url("https://images.unsplash.com/photo-1519681393784-d120267933ba")}
.bg4{background-image:url("https://images.unsplash.com/photo-1500534314209-a25ddb2bd429")}
.bgNight{background-image:url("https://images.unsplash.com/photo-1519681393784-d120267933ba")}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55)
}

.container{
position:relative;
z-index:2;
max-width:440px;
margin:auto;
top:50%;
transform:translateY(-50%);
background:rgba(255,255,255,.15);
backdrop-filter:blur(14px);
padding:30px;
border-radius:28px;
text-align:center;
animation:cardIn 1.2s ease;
}

h1{font-size:28px}
p{font-size:18px;line-height:1.6}

button,.opt{
background:rgba(255,255,255,.25);
border:none;
padding:14px;
border-radius:26px;
margin:12px 0;
font-size:16px;
color:#fff;
cursor:pointer;
transition:.3s
}
button:hover,.opt:hover{background:rgba(255,255,255,.45)}

@keyframes cardIn{
from{opacity:0;transform:translateY(60px) scale(.94)}
to{opacity:1;transform:translateY(0) scale(1)}
}

.line{
opacity:0;
transform:translateY(25px);
animation:lineIn 1s forwards;
}
@keyframes lineIn{
to{opacity:1;transform:translateY(0)}
}

.heartbeat{
animation:beat 1s infinite;
}
@keyframes beat{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}

.shake{
animation:shake .4s;
}
@keyframes shake{
0%,100%{transform:translateX(0)}
25%{transform:translateX(-6px)}
50%{transform:translateX(6px)}
75%{transform:translateX(-6px)}
}

/* Love meter */
.meter{
width:100%;
height:22px;
background:rgba(255,255,255,.3);
border-radius:20px;
overflow:hidden;
margin:14px 0
}
.fill{
height:100%;
width:0;
background:linear-gradient(90deg,#ff6a88,#ff99ac);
transition:.4s
}

/* Falling petals & stars */
.petal,.star{
position:fixed;
top:-10px;
z-index:1;
animation:fall linear infinite;
}
@keyframes fall{
to{transform:translateY(110vh);opacity:0}
}

/* Typing */
#typing{
min-height:180px;
white-space:pre-line;
}
</style>
</head>

<body class="bg1">
<div class="overlay"></div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/audio/2023/03/27/audio_8b7e3e9b1f.mp3">
</audio>

<div class="container" id="box">
<h1>Are you ready, Khushu? ❤️</h1>
<button onclick="readyNo()">NO 😏</button>
<button onclick="next()">YES 🥹💖</button>
</div>

<script>
let step=0,taps=0;
const box=document.getElementById("box");
const body=document.body;
const music=document.getElementById("music");
const bgs=["bg1","bg2","bg3","bg4"];

function next(){
step++;
if(step===1)music.play();
body.className=bgs[step%bgs.length];

if(step===1){
box.innerHTML=`<h1 class="line">Welcome baby ❤️</h1>
<p class="line" style="animation-delay:.6s">
to your hubby’s first try 🫶<br>
for a special thing for you ✨
</p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===2){
box.innerHTML=`<h1 class="line">Hi Beautiful 💖</h1>
<p class="line" style="animation-delay:.6s">
This is for you my love 😘
</p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===3){
box.innerHTML=`
<p class="line">📅 21st June, 2023</p>
<p class="line" style="animation-delay:.7s">Remember this day, my love 💗</p>
<p class="line" style="animation-delay:1.4s">
I promised you to love<br>365 days, 24 hours ⏳❤️
</p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===4){
box.innerHTML=`<h1>Love Meter 💗</h1>
<p>Tap till it becomes infinite ♾️</p>
<div class="meter"><div class="fill" id="fill"></div></div>
<button onclick="tapLove()">Tap 💖</button>
<p id="m"></p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===5){
box.innerHTML=`<h1>Our Memories 🧠💞</h1>
<div class="opt" onclick="mem('That moment still makes me smile 🥹')">First Meet 😌</div>
<div class="opt" onclick="mem('My safest place forever 🫂❤️')">First Hug 🫶</div>
<div class="opt" onclick="mem('Endless nights, endless love 🌙')">Late Night Talks 🌌</div>
<p id="rx"></p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===6){
box.innerHTML=`<h1>What makes us special? 💕</h1>
<div class="opt" onclick="mem('Trust holds us together 🤍')">Trust 🤍</div>
<div class="opt" onclick="mem('We understand each other deeply 🫶')">Understanding 🫶</div>
<div class="opt" onclick="mem('Love beyond words 💖')">Love 💖</div>
<p id="rx"></p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===7){
box.innerHTML=`<h1>Choose our vibe 😘</h1>
<div class="opt" onclick="mem('Cute & crazy is us 😜')">Cute & Crazy 😜</div>
<div class="opt" onclick="mem('Calm but deep 🌌')">Calm & Deep 🌌</div>
<div class="opt" onclick="mem('Forever partners 💍')">Forever 💍</div>
<p id="rx"></p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===8){
box.innerHTML=`<h1>How much do I love you? 💕</h1>
<div class="opt" onclick="wrong(this,'That’s cute 😏 but far from truth')">A little 🤏</div>
<div class="opt" onclick="wrong(this,'Close 😌 but not enough baby')">A lot ❤️</div>
<div class="opt" onclick="correct('You know my heart 🥹♾️')">Infinite ♾️💖</div>
<p id="rx"></p>`;
}

else if(step===9){
box.innerHTML=`<h1>My plans with you 💍👶</h1>
<div class="opt" onclick="wrong(this,'Never ever 😤')">Just time pass 😅</div>
<div class="opt" onclick="correct('You are my future 🥹❤️')">Marriage + Baby + Forever</div>
<p id="rx"></p>`;
}

else if(step===10){
box.innerHTML=`<h1>What are you to me? 🌍</h1>
<div class="opt" onclick="wrong(this,'More than that 😘')">My girlfriend 😌</div>
<div class="opt" onclick="correct('That’s my world 🥹❤️')">My everything 💫</div>
<p id="rx"></p>`;
}

else if(step===11){
box.innerHTML=`<h1>Will you be my Valentine? 💘</h1>
<button onclick="readyNo()">NO 😏</button>
<button class="heartbeat" onclick="next()">YES 😍</button>`;
}

else if(step===12){
box.innerHTML=`<h1>Why I Love You 💌</h1>
<p id="slider"></p>
<button onclick="next()">Proceed my love ➡️</button>`;
loveSlider();
}

else if(step===13){
box.innerHTML=`<h1>My Promises 🤍</h1>
<p class="line" style="animation-delay:.4s">I promise to stand by you.</p>
<p class="line" style="animation-delay:1.2s">I promise to grow old with you.</p>
<p class="line" style="animation-delay:2s">I promise to love you endlessly.</p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===14){
countdown(5);
}
}

function readyNo(){
box.classList.add("shake");
box.innerHTML=`<h1>Hey 😤💔</h1>
<p>You know the answer already 😌<br>
Choose YES, my love ❤️</p>
<button onclick="next()">YES 🥹</button>`;
setTimeout(()=>box.classList.remove("shake"),400);
}

function tapLove(){
taps++;
document.getElementById("fill").style.width=Math.min(taps*20,100)+"%";
document.getElementById("m").innerHTML=
taps>=5?"♾️ Our love is infinite ♾️":"Keep tapping baby 😘";
}

function mem(t){document.getElementById("rx").innerHTML=t}

function wrong(el,msg){
el.classList.add("shake");
document.getElementById("rx").innerHTML=msg;
setTimeout(()=>el.classList.remove("shake"),400);
}

function correct(msg){
document.getElementById("rx").innerHTML=msg;
setTimeout(next,1400);
}

function loveSlider(){
  const lines = [
    "Because you feel like home 🏡",
    "Because you understand me without words 🫶",
    "Because loving you feels natural 💖",
    "Because I choose you, always ♾️"
  ];

  const el = document.getElementById("slider");
  let i = 0;

  function showNext(){
    if(i < lines.length){
      el.style.opacity = 0;
      setTimeout(()=>{
        el.innerHTML = lines[i];
        el.style.opacity = 1;
        i++;
        setTimeout(showNext, 2200);
      },400);
    } else {
      el.style.opacity = 0;
      setTimeout(()=>{
        el.innerHTML = `
          <b>All my reasons 💖</b><br><br>
          ${lines.join("<br>")}<br><br>
          <i>These are all my reasons, my love 😘<br>
          Now proceed 💞</i>
        `;
        el.style.opacity = 1;
      },500);
    }
  }

  showNext();
}

function countdown(n){
let c=n;
box.innerHTML=`<h1>${c}</h1><p>Something special is coming… ✨</p>`;
let i=setInterval(()=>{
c--;
box.innerHTML=`<h1>${c}</h1><p>Something special is coming… ✨</p>`;
if(c===0){clearInterval(i);final()}
},1000);
}

function final(){
body.className="bgNight";
box.innerHTML=`<h1>My Love ❤️</h1>
<div id="typing"></div>
<p style="margin-top:20px">
Thank you for experiencing this, my love 💌<br>
Give feedback to your baby 🥹❤️
</p>`;
typeText(
"It's been 3 yrs and I always loved you and will always love you.\n\n"+
"This Valentine's Day I want to give you something special that I'll give you when I'll meet you.\n\n"+
"Tell me how much you liked it and always remember one thing my love…\n\n"+
"I Loveeeeeeeeeeeeeeeeee youuuuuuuuuuuuuuuuu infiniteeeeeeeeeeeeeeeee myyyyyyyyyyyy wifeyyyyyyyyyyyy\n"+
"😘😘😘😘😘😘❤️❤️❤️✨✨✨🫂🫂🫂🫂🫂💗💗💗💗💗"
);
}

function typeText(text){
let i=0;
const el=document.getElementById("typing");
el.innerHTML="";
const timer=setInterval(()=>{
el.innerHTML+=text.charAt(i);
i++;
if(i>=text.length)clearInterval(timer);
},45);
}

/* Falling petals & stars */
setInterval(()=>{
let p=document.createElement("div");
p.className="petal";p.innerHTML="🌹";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=5+Math.random()*5+"s";
document.body.appendChild(p);
setTimeout(()=>p.remove(),9000);

let s=document.createElement("div");
s.className="star";s.innerHTML="✨";
s.style.left=Math.random()*100+"vw";
s.style.animationDuration=4+Math.random()*4+"s";
document.body.appendChild(s);
setTimeout(()=>s.remove(),8000);
},800);
</script>

</body>
</html>
