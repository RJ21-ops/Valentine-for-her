<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Forever ❤️</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Poppins,Arial;
height:100vh;
color:#fff;
overflow:hidden;
background-size:cover;
background-position:center;
transition:background-image 1s ease;
}
.bg1{background-image:url("https://images.unsplash.com/photo-1501785888041-af3ef285b470")}
.bg2{background-image:url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee")}
.bg3{background-image:url("https://images.unsplash.com/photo-1519681393784-d120267933ba")}
.bg4{background-image:url("https://images.unsplash.com/photo-1500534314209-a25ddb2bd429")}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45)
}
.container{
position:relative;
z-index:2;
max-width:430px;
margin:auto;
top:50%;
transform:translateY(-50%);
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
padding:25px;
border-radius:22px;
text-align:center;
animation:slide .8s ease
}
h1{font-size:26px}
p{font-size:18px}
button,.opt{
background:rgba(255,255,255,.25);
border:none;
padding:12px;
border-radius:22px;
margin:10px 0;
font-size:16px;
color:#fff;
cursor:pointer
}
button:hover,.opt:hover{background:rgba(255,255,255,.45)}

@keyframes slide{
from{opacity:0;transform:translateY(40px) scale(.95)}
to{opacity:1;transform:translateY(0) scale(1)}
}

.line{opacity:0;animation:line 1s forwards}
@keyframes line{to{opacity:1}}

.meter{width:100%;height:22px;background:rgba(255,255,255,.3);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#ff6a88,#ff99ac);transition:.4s}

.petal,.star{
position:fixed;
top:-10px;
z-index:1;
animation:fall linear infinite
}
@keyframes fall{
to{transform:translateY(110vh);opacity:0}
}
</style>
</head>

<body class="bg1">
<div class="overlay"></div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/audio/2023/03/27/audio_8b7e3e9b1f.mp3">
</audio>

<div class="container" id="box">
<h1>Hi Beautiful 🏔️✨</h1>
<p>This is for you my love ❤️</p>
<button onclick="next()">Next ➡️</button>
</div>

<script>
let step=0,taps=0;
const box=document.getElementById("box");
const body=document.body;
const music=document.getElementById("music");
const bgs=["bg1","bg2","bg3","bg4"];

function next(){
step++;
if(step===1)music.play();
body.className=bgs[step%bgs.length];

if(step===1){
box.innerHTML=`<h1>Love Meter 💗</h1>
<p>Tap till it becomes infinite ♾️</p>
<div class="meter"><div class="fill" id="fill"></div></div>
<button onclick="tap()">Tap 💖</button>
<p id="m"></p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===2){
box.innerHTML=`<h1>MCQ 1 💕</h1>
<p>How much do I love you?</p>
<div class="opt" onclick="r('Nope 😜')">A little 🤏</div>
<div class="opt" onclick="r('Moreeee 😍')">A lot ❤️</div>
<div class="opt" onclick="r('Correct ♾️❤️')">Infinite ♾️</div>
<p id="rx"></p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===3){
box.innerHTML=`<h1>MCQ 2 💍👶</h1>
<p>What are my plans with you?</p>
<div class="opt" onclick="r('Never 😤')">Just time pass 😅</div>
<div class="opt" onclick="r('You + Me + Forever 💍👶❤️')">Marriage + Baby + Forever</div>
<p id="rx"></p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===4){
box.innerHTML=`<h1>MCQ 3 🌍</h1>
<p>What are you to me?</p>
<div class="opt" onclick="r('More than that 😘')">My girlfriend 😌</div>
<div class="opt" onclick="r('YES 🥹❤️ My everything')">My everything 💫</div>
<p id="rx"></p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===5){
box.innerHTML=`<h1>Will you be my Valentine? 💘</h1>
<button onclick="no()">NO 😏</button>
<button onclick="yes()">YES 😍</button>`;
}

else if(step===6){
box.innerHTML=`<h1>My Promises 🤍</h1>
<p class="line" style="animation-delay:.2s">I promise to stand by you.</p>
<p class="line" style="animation-delay:1s">I promise to grow old with you.</p>
<p class="line" style="animation-delay:2s">I promise to love you endlessly.</p>
<button onclick="next()">Next ➡️</button>`;
}

else if(step===7){
let c=5;
box.innerHTML=`<h1>${c}</h1><p>Something special is coming…</p>`;
let i=setInterval(()=>{
c--;
box.innerHTML=`<h1>${c}</h1><p>Something special is coming…</p>`;
if(c===0){clearInterval(i);final()}
},1000);
}
}

function tap(){
taps++;
document.getElementById("fill").style.width=Math.min(taps*20,100)+"%";
document.getElementById("m").innerHTML=
taps>=5?"♾️ Our love is infinite ♾️":"Keep tapping 😘";
}

function r(t){document.getElementById("rx").innerHTML=t}

function no(){
box.innerHTML=`<h1>Error ❌😂</h1>
<p>You are already my Valentine 😌❤️</p>
<button onclick="yes()">YES 😍</button>`;
}

function yes(){next()}

function final(){
box.innerHTML=`<h1>My Love ❤️</h1>
<p>
It's been 3 yrs and I always loved you and will always love you.<br><br>
This Valentine's Day I want to give you something special that I'll give you when I'll meet you.<br><br>
Tell me how much you liked it and always remember one thing My Love<br><br>
<b>I Loveeeeeeeeeeeeeeeeee youuuuuuuuuuuuuuuuu infiniteeeeeeeeeeeeeeeee myyyyyyyyyyyy wifeyyyyyyyyyyyy</b><br>
😘😘😘😘😘😘❤️❤️❤️✨✨✨🫂🫂🫂🫂🫂💗💗💗💗💗
</p>`;
}

setInterval(()=>{
let p=document.createElement("div");
p.className="petal";p.innerHTML="🌹";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=5+Math.random()*5+"s";
document.body.appendChild(p);
setTimeout(()=>p.remove(),9000);

let s=document.createElement("div");
s.className="star";s.innerHTML="✨";
s.style.left=Math.random()*100+"vw";
s.style.animationDuration=4+Math.random()*4+"s";
document.body.appendChild(s);
setTimeout(()=>s.remove(),8000);
},800);
</script>

</body>
</html>
